name = "sigmashake-workspace"
main = "src/worker.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

# `run_worker_first = true` so the auth middleware sees every request before
# the assets binding can serve a static file. Without this flag the SPA bundle
# (/assets/app.js, /assets/app.css) bypasses the worker and leaks to anyone
# who knows the URL.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[vars]
WORKSPACE_ENV = "production"
# GitHub user id of the operator allowed to access workspace.sigmashake.com.
# Mirrors sigmashake-support's ALLOWED_GITHUB_USER_ID — same operator account,
# same `session_id` cookie minted by accounts.sigmashake.com. Comma-separated
# to support adding additional operators without redeploying code.
ALLOWED_GITHUB_USER_IDS = "11810205"

[[routes]]
pattern = "workspace.sigmashake.com"
custom_domain = true

# ── Shared SESSIONS KV from accounts (read-only here) ────────────────────────
# Holds `session:<id>` entries written by accounts.sigmashake.com SSO. The
# auth gate reads this binding inside the worker to validate the
# `.sigmashake.com` session_id cookie. Matches the same namespace id used by
# sigmashake-support and sigmashake-calendar.
[[kv_namespaces]]
binding = "ACCOUNTS_SESSIONS"
id = "28b7cc7730d1422caeda5fe8934ce73a"
preview_id = "28b7cc7730d1422caeda5fe8934ce73a"

# ── Service bindings: inbox sources ──────────────────────────────────────────
# The unified Inbox view proxies through these. Cross-zone public fetches
# inside sigmashake.com get silently dropped by the router (see
# sigmashake-support/CLAUDE.md gotcha about the HUB binding) so support and
# sales must be reached via service bindings, not HTTPS.
[[services]]
binding = "SUPPORT"
service = "sigmashake-support"

[[services]]
binding = "SALES"
service = "sigmashake-sales"

# ── Service binding: observability board ─────────────────────────────────────
# The Observability view proxies through this to sigmashake-observ's
# /api/services endpoint. sigmashake-observ has no public route — a service
# binding is the only way to reach it, and it sidesteps the same-zone fetch
# drop. sigmashake-observ must be deployed before this Worker.
[[services]]
binding = "OBSERV"
service = "sigmashake-observ"

# ── Cross-OS platform parity matrix store ────────────────────────────────────
# Each operator host (linux / darwin / win32) writes its column to this KV on
# attest, and reads sibling columns back on snapshot build. That's how the
# workspace UI shows a true 3-OS matrix even though each machine only resolves
# its own row live. Reads are operator-gated (session cookie); writes are
# bearer-gated (PARITY_AGENT_TOKEN) so the daemon — which has no session — can
# still push. Bootstrap on first deploy:
#   wrangler kv namespace create PARITY_MATRIX
#   # paste the printed id below
#   wrangler kv namespace create PARITY_MATRIX --preview
#   # paste the printed preview_id below
[[kv_namespaces]]
binding = "PARITY_MATRIX"
id = "6f8bfedca2d5496d94c867ff16ea1df8"
preview_id = "9ad30b7017d04cdc8b5069516f3ecc3f"

# ── DOWNLOADS R2 binding (read-only) ─────────────────────────────────────────
# Same R2 bucket sigmashake-download/sigmashake-web mount. Used by the
# distribution-drift probe to read stable-<lane>-update.json keys directly —
# direct HTTPS to download.sigmashake.com fails with HTTP 522 because both
# Workers live on the same sigmashake.com zone (Cloudflare drops same-zone
# Worker fetches; documented in src/distribution-drift.ts + sigmashake-web's
# api/desktop-versions.ts). R2 bindings sidestep that entirely.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "sigmashake-downloads"

# ── Secrets (set via `wrangler secret put`) ──────────────────────────────────
# SUPPORT_AGENT_TOKEN — Bearer ssk_agent_<hex64> for /agent/tickets reads +
#                      inline triage. Provision via:
#                        cd ../sigmashake-support
#                        bun scripts/seed-agent.ts --name workspace-inbox \
#                          --scopes read,respond,resolve
#                      Then paste the printed token into:
#                        wrangler secret put SUPPORT_AGENT_TOKEN
# SALES_AGENT_TOKEN   — Bearer token gating sigmashake-sales /agent/leads*.
#                      Must match the SALES_AGENT_TOKEN value pushed on
#                      sigmashake-sales. Provision via:
#                        token=$(openssl rand -hex 32)
#                        echo "$token" | wrangler secret put SALES_AGENT_TOKEN
#                        (then push the SAME value on sigmashake-sales)
# PARITY_AGENT_TOKEN  — Bearer presented by each SSG daemon on
#                      /api/workspace/parity-matrix reads + writes. Provision:
#                        token=$(openssl rand -hex 32)
#                        echo "$token" | wrangler secret put PARITY_AGENT_TOKEN
#                        # then on every operator host (linux/mac/win):
#                        umask 077 && echo "$token" \
#                          > ~/.sigmashake/workspace-parity-token

# Stream log/error events to sigmashake-alerts (same pattern as the other Workers).
[[tail_consumers]]
service = "sigmashake-alerts"
