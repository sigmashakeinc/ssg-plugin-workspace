<!DOCTYPE html>
<html lang="en">
  <head>
  <script>
(function(){
  var c = window.__SSG_PLUGIN_CONFIG__;
  if (!c) return;
  window.__WORKSPACE_CONFIG__ = {
    runtime: 'local',
    port: c.port,
    token: c.token,
    root: ''
  };
})();
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Workspace · SigmaShake</title>
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⚒</text></svg>" />
    <style>
      /* Pre-mount skeleton — replaced by React on first render. */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050505;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Inter Tight", "Segoe UI", system-ui, sans-serif;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(40% 30% at 50% 0%, rgba(245, 158, 11, 0.18) 0%, transparent 60%),
          radial-gradient(60% 50% at 85% 100%, rgba(245, 158, 11, 0.06) 0%, transparent 60%),
          #050505;
        text-align: center;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      .splash--gone { opacity: 0; pointer-events: none; }
      .splash-mark {
        color: #f59e0b;
        filter:
          drop-shadow(0 0 14px rgba(245, 158, 11, 0.32))
          drop-shadow(0 4px 12px rgba(245, 158, 11, 0.22));
        animation: splash-pulse 2.6s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1);     opacity: 1; }
        50%      { transform: scale(1.035); opacity: 0.94; }
      }
      .splash-brand {
        font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #71717a;
      }
      .splash-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        background: linear-gradient(180deg, #fafafa 0%, #a1a1aa 100%);
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
      }
      .splash-hint {
        font-size: 12px;
        color: #71717a;
        font-variant-numeric: tabular-nums;
      }
      .splash-bar {
        width: 160px;
        height: 3px;
        margin-top: 6px;
        background: #161616;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
        border-radius: 999px;
        animation: splash-progress 1.6s cubic-bezier(0.32, 0.72, 0, 1) infinite;
      }
      @keyframes splash-progress {
        0%   { transform: translateX(-110%) scaleX(0.4); }
        60%  { transform: translateX(30%)   scaleX(0.55); }
        100% { transform: translateX(125%)  scaleX(0.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-bar::after { animation: none; }
      }
    </style>
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./app.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="ssg-splash" class="splash" aria-live="polite" aria-label="Loading workspace">
      <svg
        class="splash-mark"
        viewBox="0 0 24 24"
        width="56"
        height="56"
        aria-hidden="true"
      >
        <path
          d="M12 1.5l8.5 3.7v6.3c0 5.3-3.7 10.2-8.5 11.5C7.2 21.7 3.5 16.8 3.5 11.5V5.2L12 1.5z"
          fill="rgba(245,158,11,0.06)"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path
          d="M8.5 12.2l2.5 2.5 4.5-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <div class="splash-brand">[ SigmaShake · Workspace ]</div>
      <div class="splash-title">Loading your monorepo</div>
      <div class="splash-hint">Reading projects…</div>
      <div class="splash-bar" role="progressbar" aria-busy="true"></div>
    </div>
    <script>
      (() => {
        var splash = document.getElementById("ssg-splash");
        var root = document.getElementById("root");
        if (!splash || !root) return;
        var deadline = performance.now() + 8000;
        function tick() {
          if (root.childElementCount > 0) {
            splash.classList.add("splash--gone");
            setTimeout(() => {
              splash.parentNode?.removeChild(splash);
            }, 260);
            return;
          }
          if (performance.now() > deadline) return;
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
